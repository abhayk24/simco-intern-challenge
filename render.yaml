# Free hosting on Render (render.com): New > Blueprint > pick this repo.
services:
  - type: web
    name: cleaner-choice
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python app.py
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
